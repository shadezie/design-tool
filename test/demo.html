<!doctype html><html><head><meta charset="utf-8"><title>Token demo</title>
<style>
  /* A design-token system, the way a real one is declared. */
  :root {
    --color-text-primary: #0f172a;
    --color-text-muted: #64748b;
    --color-brand-600: #2a51fd;
    --color-brand-50: #e8edff;
    --color-surface: #ffffff;
    --color-border-subtle: #e2e8f0;
    --space-4: 16px;
    --space-6: 24px;
    --radius-lg: 12px;
    --font-size-display: 40px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 56px;
    font-family: Inter, system-ui, sans-serif;
    background: #f8fafc;
    color: var(--color-text-primary);
  }
  #hero-title {
    margin: 0 0 12px;
    font-size: var(--font-size-display);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.03em;
    color: var(--color-brand-600);
    max-width: 620px;
  }
  .sub { margin: 0 0 28px; font-size: 16px; line-height: 1.6; color: var(--color-text-muted); max-width: 520px; }
  #cta {
    display: inline-block; padding: 12px 22px;
    border: 1px solid var(--color-brand-600);
    border-radius: 8px;
    background: var(--color-brand-600);
    color: #fff; font-size: 15px; font-weight: 600;
  }
  .row { display: flex; gap: var(--space-6); margin-top: 40px; max-width: 620px; }
  .card {
    flex: 1; padding: var(--space-4);
    background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg);
  }
  .card h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.3; }
  .card p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--color-text-muted); }
  .media { display: flex; gap: 24px; margin-top: 40px; align-items: flex-start; }
  #photo { width: 180px; height: 120px; object-fit: cover; border-radius: 8px; }
  #bgvideo { width: 220px; height: 124px; border-radius: 8px; background: #0f172a; }
</style></head><body>
